# The release workflow every package calls:
#
#   release:
#     uses: schryer/pubrel/.github/workflows/release.yml@vX.Y.Z
#     with: { pubrel-version: vX.Y.Z }
#
# On a pull request, `pubrel check` holds the change to the rules: code
# changes record what they change; a release is the bump its changes
# require, and published. On main, `pubrel tag` tags and releases a
# version the package publet records as released. Both read the package
# publet and verify its signatures in-process, so no `pub` is installed.
# Nothing here signs: a release is signed when its package publet is
# published, locally.
name: release

on:
  workflow_call:
    inputs:
      pub-version:
        description: Ignored; kept so callers that still pass it keep working. pubrel no longer needs pub in CI.
        type: string
        default: ''
      pubrel-version:
        description: The pubrel tag to install pubrel from; empty builds it from this checkout.
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - if: inputs.pubrel-version != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/pubrel
          key: pubrel-${{ inputs.pubrel-version }}-${{ runner.os }}
      - name: Install pubrel
        run: |
          if [ -n "$INPUT_PUBREL" ]; then
            command -v pubrel >/dev/null && pubrel --version | grep -q "^pubrel ${INPUT_PUBREL#v}$" \
              || cargo install --locked --git https://github.com/schryer/pubrel --tag "$INPUT_PUBREL" pubrel
          else
            cargo install --locked --path .
          fi
          pubrel --version
        env:
          INPUT_PUBREL: ${{ inputs.pubrel-version }}
      - name: Check this change against the release rules
        if: github.event_name == 'pull_request'
        run: pubrel check "origin/${{ github.base_ref }}"
      - name: Tag and release what main publishes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pubrel tag
        env:
          GH_TOKEN: ${{ github.token }}
