name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  # The shared Rust CI: gates, cargo test on three platforms, and the Gherkin
  # suite against a released pub.
  ci:
    uses: schryer/pubkit/.github/workflows/rust-ci.yml@v0.2.0
    with: { pub-version: v0.1.1 }

  # pubrel is held to its own rules, by its own workflow, built from this
  # checkout -- so a change to the workflow is tested before a release
  # carries it to anyone else.
  release:
    needs: ci
    uses: ./.github/workflows/release.yml
    with:
      pub-version: v0.1.1
    permissions:
      contents: write
