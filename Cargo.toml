[package]
name = "pubrel"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Version packages by what changed, and record each release as a version of a package publet."
repository = "https://github.com/schryer/pubrel"

[[bin]]
name = "pubrel"
path = "src/main.rs"

[dependencies]
serde_json = "1"
toml_edit = "0.22"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
